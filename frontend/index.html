<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS Minimal UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>CMS Minimal UI</h1>
      <nav class="quick-links">
        <a href="#register">UC-01 Register</a>
        <a href="#login">UC-03 Login</a>
        <a href="#submit">UC-05 Submit</a>
        <a href="#pricing">UC-19 Pricing</a>
        <a href="#payment">UC-20 Payment</a>
      </nav>

      <section id="register">
        <h2>Register</h2>
        <form id="register-form">
          <label>
            Email
            <input type="email" name="email" required />
          </label>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
          <button type="submit">Register</button>
        </form>
      </section>

      <section id="login">
        <h2>Login</h2>
        <form id="login-form">
          <label>
            Email
            <input type="email" name="email" required />
          </label>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
          <button type="submit">Login</button>
        </form>
      </section>

      <section id="submit">
        <h2>Submit Paper</h2>
        <form id="submission-form">
          <label>
            Title
            <input type="text" name="title" required />
          </label>
          <label>
            Abstract
            <textarea name="abstract" required></textarea>
          </label>
          <label>
            Authors
            <input type="text" name="authors" required />
          </label>
          <label>
            Keywords
            <input type="text" name="keywords" required />
          </label>
          <label>
            Manuscript Filename
            <input type="text" name="filename" required />
          </label>
          <label>
            Manuscript Size (bytes)
            <input type="number" name="sizeBytes" required />
          </label>
          <button type="submit">Submit</button>
        </form>
      </section>

      <section id="pricing">
        <h2>View Pricing</h2>
        <button id="pricing-button" type="button">Load Pricing</button>
      </section>

      <section id="payment">
        <h2>Pay Registration</h2>
        <form id="payment-form">
          <label>
            Card Last 4
            <input type="text" name="cardLast4" required />
          </label>
          <label>
            Billing Name
            <input type="text" name="billingName" required />
          </label>
          <button type="submit">Pay</button>
        </form>
      </section>

      <section>
        <h2>Change Password</h2>
        <form id="password-form">
          <label>
            Current Password
            <input type="password" name="currentPassword" required />
          </label>
          <label>
            New Password
            <input type="password" name="newPassword" required />
          </label>
          <button type="submit">Change Password</button>
        </form>
      </section>

      <section>
        <h2>Response</h2>
        <pre id="output" class="output">Ready.</pre>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
